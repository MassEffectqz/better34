name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - name: Install frontend
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Verify generated bundle
        run: git diff --exit-code -- static/js/dist
      - name: i18n keys (parity, duplicates, placeholders, unused)
        run: npm run check:i18n
      - name: Icons (every data-lucide/icon() name exists in ICONS)
        run: npm run check:icons
      - name: //go:embed targets (fresh clone must build)
        run: npm run check:embed
      - name: Batch script traps (unbalanced parens, metachars in for /f)
        run: npm run check:batch
      - name: Mobile/touch invariants
        run: npm run check:mobile
      - name: Go quality gate
        run: npm run check:go
      - name: staticcheck (unused-code check U1000 отключён намеренно)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" -checks=inherit,-U1000 . ./internal/...
      - name: Go race tests
        run: npm run check:race
