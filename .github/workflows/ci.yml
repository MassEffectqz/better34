name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      # SHA-пиннинг: теги actions можно переписать, SHA — нет (supply chain).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      # Форматирование: списки незаформленных файлов проваливают сборку.
      - name: Format
        run: test -z "$(gofmt -l main.go internal)" || (gofmt -l main.go internal; exit 1)
      # Локально race-детектор недоступен (нет gcc) — гонки ловим только тут.
      - name: Test (race)
        run: go test -race ./...

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Bundle
        run: npm run build
